<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snapget — Lời mời kết bạn</title>
  <!-- Landing page cho link mời kết bạn https://snapget-d8693.web.app/invite/{code}.
       Máy đã cài app + App Links verify OK sẽ mở thẳng app, không thấy trang này.
       Trang này dành cho: máy chưa cài app, hoặc bấm link trên máy tính. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1e1e1e;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
    }
    .logo { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #9e9e9e; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    .code {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 10px 16px;
      font-family: monospace;
      font-size: 16px;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: 20px;
      display: inline-block;
      user-select: all;
    }
    a.btn {
      display: block;
      background: #fff;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .hint { font-size: 12px; color: #757575; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📸</div>
    <h1>Lời mời kết bạn Snapget</h1>
    <p>Bạn của bạn muốn kết nối trên Snapget!<br>Mở app để gửi lời mời kết bạn — chủ link xác nhận là hai bạn thành bạn bè.</p>
    <div class="code" id="inviteCode">—</div>
    <a class="btn" id="openApp" href="#">Mở app Snapget</a>
    <p class="hint">Chưa cài Snapget? Hãy cài app trước (APK từ nhóm phát triển), sau đó bấm lại link này hoặc nhập mã mời ở màn "Add new friend".</p>
  </div>
  <script>
    // Lấy mã mời từ path /invite/{code} (rewrite về index.html nên path còn nguyên)
    var match = location.pathname.match(/\/invite\/([^\/]+)/);
    var code = match ? match[1] : '';
    document.getElementById('inviteCode').textContent = code || 'Không tìm thấy mã';
    var btn = document.getElementById('openApp');
    if (code) {
      // intent:// mở app qua scheme snapget:// trên Chrome Android; máy khác fallback scheme thô
      var isAndroid = /android/i.test(navigator.userAgent);
      btn.href = isAndroid
        ? 'intent://invite/' + code + '#Intent;scheme=snapget;package=com.example.snapget;end'
        : 'snapget://invite/' + code;
    } else {
      btn.style.display = 'none';
    }
  </script>
</body>
</html>
